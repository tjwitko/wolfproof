# This repository running its own gate, plus the regression corpus.
#
# The gate is the product; the corpus is what stops the gate rotting. Every control defect in this
# project's history was found by running real work through the controls, not by unit tests, so the
# corpus runs here alongside them.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, whether or not anything was pushed. Advisories arrive without a commit: between 27
  # September and 13 October every repository in this estate gained a critical and a high from new
  # advisories against dependencies nobody had touched, and CI stayed green because nothing ran.
  # The next push would have been the first to find out, and would have gone red for reasons that
  # had nothing to do with what it changed.
  #
  # Monday 06:17 UTC. Off the hour, because scheduled runs at :00 are the ones GitHub most often
  # delays or drops under load. GitHub also disables scheduled workflows in a public repository after
  # 60 days without activity -- precisely the dormant repository this is for. It emails the owner
  # when it does; re-enable it from the Actions tab.
  schedule:
    - cron: "17 6 * * 1"
  # Run it now, without pushing anything.
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A matrix because one Node version hid a defect in the product's own output for a month.
        # `node --test` emits the spec format to a TTY and TAP to a pipe, and this code always reads
        # a pipe -- so the format depends on the Node version. 22 emits TAP, 26 emits spec, the
        # development machine runs 26, and the failing-test-name parser only knew spec. On CI the
        # gate printed "1 of 2 test(s) FAILED" followed by a sentence telling the reader to check
        # the names above, with no names above.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      # agent/unscanned-manifests.test.mjs holds a measured table of what osv-scanner reads to the
      # real scanner, at the version control-tooling pins. Locally it skips without one; here the
      # variable makes a missing scanner a failure, because a skipped test verified nothing.
      - name: osv-scanner
        env:
          OSV_VERSION: "2.4.0"
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          sudo chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      # agent/sast.test.mjs runs the rules through semgrep's own test runner, at the version
      # control-tooling pins. The same variable makes its absence a failure rather than a skip.
      - name: semgrep
        run: pipx install semgrep==1.180.0 && semgrep --version
      # test/factory-scenario.e2e.mjs runs the real gate over the Dark Factory measurement, and the
      # scenario's hardcoded credentials are found by secret-guard, which runs gitleaks. Same pin as
      # control-tooling.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version
      - run: npm test
        env:
          WOLFPROOF_REQUIRE_SCANNERS: "1"
      # Its own step, not part of `npm test`: these runs take 31-54s, and `npm test`'s files are what
      # the gate's tests check executes when the self job below gates this repository, inside the
      # limit that job sets.
      - name: factory mode, end to end
        run: npm run test:factory
        env:
          WOLFPROOF_REQUIRE_SCANNERS: "1"

  corpus:
    name: regression corpus
    # Not on the weekly schedule. This job's subject is a frozen deliverable scanned against a live
    # advisory database, and controls only change on a push -- so on a schedule it can only report
    # that the database moved, under a message blaming a control. Four fixtures drifted exactly that
    # way when GHSA-jqcg-44mw-7w3h was published on 5 October. The schedule exists for this
    # repository's own dependencies, which the `self` job checks.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/control-tooling
      # One provider download per job instead of one per fixture. `terraform init` runs once for
      # every Terraform root across eleven deliverables, and the AWS provider is not small.
      - name: terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('corpus/fixtures.tar.gz') }}
          restore-keys: tf-plugins-${{ runner.os }}-
      # The fixtures ship in the repository as corpus/fixtures.tar.gz, so this job needs nothing
      # beside the checkout. It does NOT pass when they are absent. The first version of it did --
      # `exit 0` with a warning -- which is a job reporting green while verifying nothing, in the
      # workflow of a project whose entire subject is gates that do that. The corpus exits 3 when it
      # cannot find its fixtures, distinct from exit 1 for drift, and both are surfaced distinctly
      # here for the same reason the gate distinguishes them.
      - name: corpus
        run: |
          set +e
          npm run corpus
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "::notice title=corpus::all fixtures match" ;;
            3) echo "::error title=corpus: DID NOT RUN::The fixtures are not present, so nothing was verified. Set CORPUS_FIXTURES or check them out beside this repository." ;;
            *) echo "::error title=corpus: drift::A frozen verdict moved. Either a control changed behaviour or the advisory database did -- the log says which validators moved." ;;
          esac
          exit $CODE
      # The same fixtures in factory mode, against their own frozen verdicts, each deliverable judged
      # as a change written from nothing. Run after a default-mode failure too: the two answer
      # different questions, and one red step should not hide the other's result.
      - name: corpus, factory mode
        if: success() || failure()
        run: |
          set +e
          npm run corpus:factory
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "::notice title=corpus (factory)::all fixtures match in factory mode" ;;
            3) echo "::error title=corpus (factory): DID NOT RUN::Fixtures are missing, or a fixture has no frozen factory verdict. Nothing was verified for it." ;;
            *) echo "::error title=corpus (factory): drift::A frozen factory-mode verdict moved. The log names the refusal or check that moved." ;;
          esac
          exit $CODE

  self:
    # The gate, against this repository. The four control repositories have gated themselves since
    # they gained a task file; this one never did -- the jobs below run the action against corpus
    # fixtures and never against `.`. So for a month this project failed its own gate: two credential
    # findings from comments in agent/authentication.mjs quoting the patterns it detects, found only
    # when someone installed it elsewhere and pointed it at itself. A security gate that fails on its
    # own source is not believed, and this job is what would have caught it the day it was written.
    name: the gate, against this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/control-tooling
      - uses: ./
        # The limit on this repository's own suite, which is CPU-bound and has outgrown two limits:
        # exit 3 from a limit, not from the project, each time.
        #   - 20 October, 683 tests: `npm test` took 89-100s in the unit-test jobs on a 4-vCPU runner,
        #     and the default 120s killed it here on 21863d3, a README-only commit. The limit became 300.
        #   - 11 November, 1,054 tests: 140-241s in the unit-test jobs of the ten runs up to 2b0c1aa
        #     (30 jobs, median 181s), and 300 killed it here on 1f7e9ca and 2b0c1aa, two merges whose
        #     trees had passed as pull requests. The rest of the gate took 75s in each.
        # The limit became 900: three times the limit the suite was known to exceed, since a killed run
        # does not say how much longer it needed.
        # The suite does more here than in the unit-test jobs, which do not install checkov: it started
        # checkov 49 times on the runs below (38 since the scans stopped asking its version first).
        # The `tests` line this job prints says how long the suite took, beside the limit. One run
        # has printed it so far, 721ade5 as a pull request, 1,056 tests: 232s here, in a step of 297s,
        # against 198s, 160s and 142s in the unit-test jobs of the same run. That is 1.2 to 1.6 times
        # as long, and 900 is 3.9 times that reading.
        # The two runs before it did not print the time (f2da804 as a pull request and a17fc8c, its
        # merge; 1,054 tests). Their steps took 403s and 419s, which is about 328s and 344s for the
        # suite only if the rest of the gate took the 75s it did in the killed runs; it took 65s on
        # the run that printed. Estimates, then, and 1.4 to 2.3 times the unit-test jobs of those runs.
        # So a limit for this job cannot be set from what the unit-test jobs print. Raise it when this
        # job's `tests` line passes 600s: one run can take half as long again as another (the unit-test
        # job on this job's Node, 240s and then 160s on one tree half an hour apart; this step, 419s
        # and then 297s on trees two tests apart, 1.4 times). docs/candidate-rules.md #18 has where
        # the time goes.
        env:
          WOLFPROOF_TEST_TIMEOUT: "900"
        with:
          project: .
          task-file: .github/gate-task.txt

  action:
    name: the action, against fixtures with known verdicts
    # Not on the weekly schedule. This job's subject is a frozen deliverable scanned against a live
    # advisory database, and controls only change on a push -- so on a schedule it can only report
    # that the database moved, under a message blaming a control. Four fixtures drifted exactly that
    # way when GHSA-jqcg-44mw-7w3h was published on 5 October. The schedule exists for this
    # repository's own dependencies, which the `self` job checks.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/control-tooling
      - name: terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('corpus/fixtures.tar.gz') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      # Fixtures with verdicts frozen in corpus/manifest.json, so this asserts the action's
      # behaviour rather than merely running it. The earlier version of this job pointed the gate at
      # this repository, which reported four blocking findings -- every one of them inside bench/,
      # where the fixtures are deliberately imperfect because that is what proves the rules fire.
      # A tool is not a webhook receiver, and gating it as though it were is theatre that would have
      # made this workflow red from its first run.
      - name: unpack fixtures
        run: |
          mkdir -p "${RUNNER_TEMP}/fixtures"
          tar -xzf corpus/fixtures.tar.gz -C "${RUNNER_TEMP}/fixtures"
          # Two copies of the clean fixture for the source scan, each with one file only CodeQL judges:
          # a password written to the log (js/clear-text-logging, error level), and a Kotlin file with
          # no build around it, which CodeQL's autobuild cannot build. Without --codeql both are clean.
          f="${RUNNER_TEMP}/fixtures"
          cp -R "$f/webhook-sonnet-2" "$f/codeql-logs-password"
          mkdir -p "$f/codeql-logs-password/scripts"
          printf '%s\n' 'const password = process.argv[2];' 'console.log("connecting with " + password);' > "$f/codeql-logs-password/scripts/show.js"
          cp -R "$f/webhook-sonnet-2" "$f/codeql-unbuildable"
          mkdir -p "$f/codeql-unbuildable/tools"
          printf '%s\n' 'fun main() {' '    println("hello")' '}' > "$f/codeql-unbuildable/tools/Main.kt"
          # The uncommitted_work validator reads git state, so each fixture needs a repository with
          # everything committed -- which is why the archive carries none.
          for d in "${RUNNER_TEMP}/fixtures"/*/; do
            git -C "$d" init -q
            git -C "$d" add -A
            git -C "$d" -c user.name=ci -c user.email=ci@localhost commit -qm "fixture"
          done
          # The dockerfile check judges base images against end-of-life dates, so the clean fixture's
          # verdict would change on the day its node:22 ages out, with nothing changed here. Judged as
          # of the date the corpus was measured, like corpus/run.mjs does, so this job tests the
          # action rather than the calendar.
          echo "WOLFPROOF_TODAY=$(node -p 'require("./corpus/manifest.json").measured')" >> "$GITHUB_ENV"

      - id: clean
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt

      - id: blocked
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-haiku-3
          task-file: agent/fixtures/webhook-receiver-task.txt

      # Exit 3 is the outcome this whole contract exists to keep distinct from exit 1, so it is
      # asserted rather than assumed. Pointing a control at a path that does not exist is the
      # cheapest way to produce it.
      - id: incomplete
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt
          terraform-guard: /nonexistent/server.mjs

      # The image scan, on the clean fixture, so the image alone decides each verdict. An image with
      # nothing in it is clean; node:18.0.0-alpine (2022, Alpine 3.15) has fixed CRITICAL and HIGH
      # vulnerabilities that will not go away; an image that does not exist could not be scanned.
      - name: images for the image scan
        run: |
          d="${RUNNER_TEMP}/scratch-image"
          mkdir -p "$d" && echo hello > "$d/hello.txt"
          printf 'FROM scratch\nCOPY hello.txt /hello.txt\n' > "$d/Dockerfile"
          docker build -q -t wolfproof-ci-scratch:test "$d"
          docker pull -q node:18.0.0-alpine

      - id: trivy-clean
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt
          trivy-image: wolfproof-ci-scratch:test

      - id: trivy-blocked
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt
          trivy-image: node:18.0.0-alpine

      - id: trivy-missing
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt
          trivy-image: wolfproof-no-such-image:ci

      # The source scan. The clean fixture stays clean; the same project with a password written to
      # the log is blocked; with a Kotlin file nothing can build, it could not be analysed.
      - id: codeql-clean
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt
          codeql: "true"

      - id: codeql-blocked
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/codeql-logs-password
          task-file: agent/fixtures/webhook-receiver-task.txt
          codeql: "true"

      - id: codeql-unbuildable
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/codeql-unbuildable
          task-file: agent/fixtures/webhook-receiver-task.txt
          codeql: "true"

      - name: assert
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "  ok   $1 -> $2"; else echo "  FAIL $1 -> got '$2', want '$3'"; fail=1; fi
          }
          check "clean fixture"        "${{ steps.clean.outputs.outcome }}"      "clean"
          check "blocked fixture"      "${{ steps.blocked.outputs.outcome }}"    "blocked"
          check "unreachable control"  "${{ steps.incomplete.outputs.outcome }}" "incomplete"
          check "image, nothing in it" "${{ steps.trivy-clean.outputs.outcome }}"   "clean"
          check "image, fixable vulns" "${{ steps.trivy-blocked.outputs.outcome }}" "blocked"
          check "image, not found"     "${{ steps.trivy-missing.outputs.outcome }}" "incomplete"
          check "codeql, clean"        "${{ steps.codeql-clean.outputs.outcome }}"   "clean"
          check "codeql, error result" "${{ steps.codeql-blocked.outputs.outcome }}" "blocked"
          check "codeql, no build"     "${{ steps.codeql-unbuildable.outputs.outcome }}" "incomplete"
          # A blocked run and an incomplete run must not report the same thing. That confusion is the
          # silent pass this control set exists to remove, and at CI scale it is invisible.
          if [ "${{ steps.blocked.outputs.outcome }}" = "${{ steps.incomplete.outputs.outcome }}" ]; then
            echo "  FAIL blocked and incomplete reported identically"
            fail=1
          fi
          exit $fail

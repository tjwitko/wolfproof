name: wolfproof review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  wolfproof-review:
    uses: tjwitko/wolfproof-review/.github/workflows/review.yml@v0.3.6
    # A review that was due and did not finish fails this check, so it is not read as a review that
    # found nothing. No finding fails it.
    with:
      on-unfinished: fail
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

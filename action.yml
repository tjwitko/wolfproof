name: "wolfproof"
description: "Run the security control set against a project and fail the build on blocking findings or on a control that could not run."
author: "tjwitko"

inputs:
  project:
    description: "Directory to validate."
    required: false
    default: "."
  task-file:
    description: >-
      The task description. Six checks are gated on what the task asked for — immutability,
      retention, secret rotation, tests, error distinction and required artifacts. Without this they
      report "not checked", which is accurate and much less useful.
    required: false
    default: ""
  baseline:
    description: >-
      Requirement sentences the project is held to whatever its task file says — "Include automated
      tests that someone else can run.", "Every API key must be rotatable without a redeploy." They
      are added to the task text, so they switch on the same gated checks. The task file is in the
      repository the code's author edits; this input is not, when the workflow that sets it is kept
      out of their reach (an organisation ruleset's required workflow, for instance).
    required: false
    default: ""
  terraform-guard:
    description: "Path to terraform-guard-mcp/index.mjs. Overrides .wolfproof.json and node_modules."
    required: false
    default: ""
  dep-audit:
    description: "Path to dep-audit-mcp/index.mjs."
    required: false
    default: ""
  secret-guard:
    description: "Path to secret-guard-mcp/index.mjs."
    required: false
    default: ""
  identity-guard:
    description: "Path to identity-guard-mcp/index.mjs."
    required: false
    default: ""
  factory:
    description: >-
      "true" for a pipeline where no person reviews the change. Nothing the change grants itself
      loosens the gate: controls come only from the pinned packages or the inputs above, never from
      the project's .wolfproof.json; an exemption, opt-out or ignore entry is honoured only if it
      existed at the base or the allowlist approves it; and an advisory that means "nothing was
      checked" blocks. See docs/factory-mode.md in this repository.
    required: false
    default: "false"
  base:
    description: >-
      Factory mode: the commit the change is compared with. Defaults to the pull request's base,
      or for a push to the commit before it. The action fetches it if the checkout does not have it,
      so the default `fetch-depth: 1` is enough.
    required: false
    default: ""
  allowlist:
    description: >-
      Factory mode: JSON approving specific exemptions, as {"exemptions": [{"kind", "path",
      "reason"}]}. Written outside the workspace, so the change cannot edit it.
    required: false
    default: ""
  policy:
    description: >-
      Factory mode: JSON choosing what each advisory class does, as {"advisories": {"<id or class>":
      "block" | "drop" | "incomplete"}}. By default "nothing was checked" blocks and lower-confidence
      findings are counted and dropped.
    required: false
    default: ""
  reviewed:
    description: >-
      Findings that have been reviewed, as {"reviewed": [{"id", "reason", "reviewer"?, "expires"?}]},
      in either mode. Written outside the workspace, so the change cannot edit it. Each one is listed
      on every run and does not block; `wolfproof review <project>` lists finding IDs. The project's
      own list is .wolfproof-reviewed.json.
    required: false
    default: ""
  trivy-image:
    description: >-
      A container image to scan with Trivy, usually one an earlier step built ("myapp:ci"). Its
      vulnerabilities join the verdict: one at trivy-severity or above with a fixed version blocks,
      the rest are advisories, and a scan that could not run makes the run incomplete. Trivy is
      installed by this action at a pinned version, checked against its published SHA-256. Linux
      runners only. Empty, the default, skips it.
    required: false
    default: ""
  trivy-severity:
    description: "The lowest severity that blocks when a fix exists: CRITICAL, HIGH, MEDIUM or LOW."
    required: false
    default: "HIGH"
  codeql:
    description: >-
      "true" to analyse the source with CodeQL's code-scanning suites as well. A result at error
      level blocks, the rest are advisories, and a language that could not be analysed makes the run
      incomplete. Go, Swift and Kotlin are built first with CodeQL's autobuild, which runs the
      project's build. LICENCE: without GitHub Advanced Security, CodeQL's terms allow this only for a
      codebase under an OSI-approved open-source licence, in CI only when it is hosted on GitHub.com;
      wolfproof cannot tell whether yours is. The bundle (about 550 MB) is installed by this action at
      a pinned version, checked against its published SHA-256. Linux and macOS runners.
    required: false
    default: "false"

outputs:
  outcome:
    description: "clean | blocked | incomplete"
    value: ${{ steps.gate.outputs.outcome }}
  blocking:
    description: "Number of blocking findings."
    value: ${{ steps.gate.outputs.blocking }}
  result:
    description: "Path to the machine-readable result JSON."
    value: ${{ steps.gate.outputs.result }}

runs:
  using: "composite"
  steps:
    # An action checked out by `uses:` arrives as source with no node_modules, and nothing else
    # installs them. This repository's own workflow runs `npm ci` and then `uses: ./`, which made
    # the gap invisible from here: it worked in the only place it was ever tried. From any other
    # repository the gate crashed with ERR_MODULE_NOT_FOUND before checking anything.
    #
    # --ignore-scripts because this installs a dependency tree in someone else's CI, and the four
    # control servers are spawned as trusted code a moment later.
    - name: install the gate's dependencies
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH"

    # Trivy, only when an image is named. Not aquasecurity/trivy-action and not a tag: in March 2026
    # 76 of that action's 77 version tags were force-pushed to credential-stealing code and a
    # malicious Trivy release was published (CVE-2026-33634). A tag says what someone last pointed
    # it at; a SHA-256 fixed here says what was checked. v0.76.0's checksums file is signed by
    # Trivy's release workflow at that tag, and these two lines are from it.
    #
    # A failed install does not stop the action: the gate is told where the binary should be, finds
    # nothing there, and says the image was not scanned, which makes the run incomplete. A trivy
    # already on the runner is never used in its place.
    - name: install trivy
      if: inputs.trivy-image != ''
      shell: bash
      env:
        TRIVY_VERSION: "0.76.0"
      run: |
        set +e
        dir="${RUNNER_TEMP}/wolfproof-trivy"
        rm -rf "$dir" && mkdir -p "$dir"
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)   asset="Linux-64bit"; sum="e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7" ;;
          Linux/ARM64) asset="Linux-ARM64"; sum="aab21e677a7b7071fc79f1711480840754c18a1b9d9cefa7ccd06af63a0e8f4c" ;;
          *) echo "::error title=wolfproof: trivy not installed::trivy-image is supported on Linux runners only, not ${RUNNER_OS}/${RUNNER_ARCH}."; exit 0 ;;
        esac
        url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${asset}.tar.gz"
        if ! curl -fsSL -o "$dir/trivy.tar.gz" "$url"; then
          echo "::error title=wolfproof: trivy not installed::could not download $url"; exit 0
        fi
        if ! echo "$sum  $dir/trivy.tar.gz" | sha256sum -c --quiet -; then
          echo "::error title=wolfproof: trivy not installed::$url does not match the SHA-256 pinned in this action. It was not installed."
          rm -f "$dir/trivy.tar.gz"; exit 0
        fi
        tar -xzf "$dir/trivy.tar.gz" -C "$dir" trivy && rm -f "$dir/trivy.tar.gz"
        echo "trivy ${TRIVY_VERSION} installed and verified: $("$dir/trivy" --version 2>&1 | head -1)"

    # CodeQL, only when asked for: the bundle, which is the CLI with its query packs, from
    # github/codeql-action's release codeql-bundle-v2.27.3. That release is immutable, and the
    # SHA-256s below are the asset digests GitHub publishes for it and its signed release attestation
    # lists; the macOS bundle was checked with `gh release verify-asset`. As for trivy: a failed
    # install leaves nothing where the gate looks, which makes the run incomplete, and a codeql
    # already on the runner (GitHub's images carry one) is never used in its place.
    - name: install codeql
      if: inputs.codeql == 'true'
      shell: bash
      env:
        BUNDLE_TAG: "codeql-bundle-v2.27.3"
      run: |
        set +e
        dir="${RUNNER_TEMP}/wolfproof-codeql"
        rm -rf "$dir" && mkdir -p "$dir"
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)   asset="codeql-bundle-linux64.tar.zst";     sum="5e7607e1b721728955e31f5402d460ad227cbd2ffed0d4cc610116755796150e" ;;
          Linux/ARM64) asset="codeql-bundle-linux-arm64.tar.zst"; sum="82a7828e050573e885ba96620c5b72db985ef4a88118dd2baf14ae7b325064d7" ;;
          macOS/*)     asset="codeql-bundle-osx64.tar.zst";       sum="c773b4654a641d02967f40d994bab1850fd8bc3bddb3d20f9af17b0cca3c9a29" ;;
          *) echo "::error title=wolfproof: codeql not installed::codeql is supported on Linux and macOS runners, not ${RUNNER_OS}/${RUNNER_ARCH}."; exit 0 ;;
        esac
        if ! command -v zstd >/dev/null; then
          echo "::error title=wolfproof: codeql not installed::the bundle is zstd-compressed and zstd is not on this runner."; exit 0
        fi
        url="https://github.com/github/codeql-action/releases/download/${BUNDLE_TAG}/${asset}"
        if ! curl -fsSL -o "$dir/bundle.tar.zst" "$url"; then
          echo "::error title=wolfproof: codeql not installed::could not download $url"; exit 0
        fi
        got=$( (sha256sum "$dir/bundle.tar.zst" 2>/dev/null || shasum -a 256 "$dir/bundle.tar.zst") | cut -d' ' -f1)
        if [ "$got" != "$sum" ]; then
          echo "::error title=wolfproof: codeql not installed::$url does not match the SHA-256 pinned in this action. It was not installed."
          rm -f "$dir/bundle.tar.zst"; exit 0
        fi
        zstd -dcq "$dir/bundle.tar.zst" | tar -xf - -C "$dir" && rm -f "$dir/bundle.tar.zst"
        echo "codeql bundle ${BUNDLE_TAG#codeql-bundle-} installed and verified: $("$dir/codeql/codeql" version 2>&1 | head -1)"

    - id: gate
      shell: bash
      env:
        TFGUARD_SERVER: ${{ inputs.terraform-guard }}
        DEPAUDIT_SERVER: ${{ inputs.dep-audit }}
        SECRETGUARD_SERVER: ${{ inputs.secret-guard }}
        IDENTITYGUARD_SERVER: ${{ inputs.identity-guard }}
        # Through the environment, never interpolated into the script: it is free text.
        WOLFPROOF_BASELINE: ${{ inputs.baseline }}
        # Factory mode's inputs and the event's two candidate bases, through the environment for the
        # same reason. These are read by this script only; the gate reads none of them.
        FACTORY: ${{ inputs.factory }}
        FACTORY_BASE: ${{ inputs.base }}
        FACTORY_ALLOWLIST: ${{ inputs.allowlist }}
        FACTORY_POLICY: ${{ inputs.policy }}
        REVIEWED: ${{ inputs.reviewed }}
        REVIEW_PROJECT: ${{ inputs.project }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        # Not TRIVY_*: the scan passes few of those on to Trivy, and says so of the rest.
        SCAN_IMAGE: ${{ inputs.trivy-image }}
        SCAN_SEVERITY: ${{ inputs.trivy-severity }}
        # Not CODEQL_*: the scan passes none of those on to CodeQL.
        SCAN_CODEQL: ${{ inputs.codeql }}
      run: |
        # GitHub runs composite `run:` steps as `bash --noprofile --norc -e -o pipefail`, and
        # `set -uo pipefail` does NOT clear that inherited -e. The gate's exit code is this action's
        # entire result -- 1 is "blocking", 3 is "could not run" -- so under errexit the gate
        # aborted the step the instant it reported anything other than clean, and every line below
        # this one was dead code: no rendered findings, no `outcome`, no annotation, just a bare
        # "Process completed with exit code 1". The action could only ever report success.
        #
        # That is precisely the confusion this action exists to prevent, so errexit is turned off
        # explicitly and each command's failure is handled where it happens.
        set +e
        set -uo pipefail

        # Empty inputs must not become empty env vars: resolve-controls treats a set variable as an
        # explicit instruction and errors when it points nowhere, which would turn "not configured"
        # into "misconfigured" for every consumer who does not override a control.
        # Written as `if` rather than `[ ... ] && unset`, because that && list returns non-zero
        # whenever the variable IS set, which under the inherited errexit killed the step for the
        # one case that supplies an override.
        for v in TFGUARD_SERVER DEPAUDIT_SERVER SECRETGUARD_SERVER IDENTITYGUARD_SERVER; do
          if [ -z "${!v}" ]; then unset "$v"; fi
        done

        RESULT="${RUNNER_TEMP:-/tmp}/wolfproof.json"
        ARGS=("${{ inputs.project }}")
        [ -n "${{ inputs.task-file }}" ] && ARGS+=("${{ inputs.task-file }}")
        # Written outside the workspace, so nothing in the checkout can stand in for it.
        if [ -n "$WOLFPROOF_BASELINE" ]; then
          BASELINE_FILE="${RUNNER_TEMP:-/tmp}/wolfproof-baseline.txt"
          printf '%s\n' "$WOLFPROOF_BASELINE" > "$BASELINE_FILE"
          ARGS+=("--baseline=$BASELINE_FILE")
        fi

        # Factory mode compares the change with its base, so the base has to be in the checkout --
        # and actions/checkout fetches depth 1 by default, which holds the head commit only. Fetching
        # the base commit itself at depth 1 is enough: the gate reads its tree and diffs two trees,
        # and needs no history between them. A push with no previous commit (a new branch) falls back
        # to the head's parent, fetched by deepening one level. If the fetch fails anyway the gate
        # says the base is not in the checkout and exits 3, which is the right answer.
        if [ "$FACTORY" = "true" ]; then
          BASE="$FACTORY_BASE"
          if [ -z "$BASE" ]; then
            if [ -n "$PR_BASE_SHA" ]; then
              BASE="$PR_BASE_SHA"
            elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$PUSH_BEFORE"
            else
              BASE="HEAD~1"
            fi
          fi
          if ! git -C "${{ inputs.project }}" rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            if [ "$BASE" = "HEAD~1" ]; then
              git -C "${{ inputs.project }}" fetch --no-tags --quiet --deepen=1 origin || true
            else
              git -C "${{ inputs.project }}" fetch --no-tags --quiet --depth=1 origin "$BASE" || true
            fi
          fi
          echo "factory: comparing with base $BASE"
          ARGS+=("--factory" "--base=$BASE")
          # Outside the workspace, like the baseline: an allowlist the change can edit approves
          # whatever the change likes, and the gate refuses one inside the project.
          if [ -n "$FACTORY_ALLOWLIST" ]; then
            printf '%s\n' "$FACTORY_ALLOWLIST" > "${RUNNER_TEMP:-/tmp}/wolfproof-allowlist.json"
            ARGS+=("--allowlist=${RUNNER_TEMP:-/tmp}/wolfproof-allowlist.json")
          fi
          if [ -n "$FACTORY_POLICY" ]; then
            printf '%s\n' "$FACTORY_POLICY" > "${RUNNER_TEMP:-/tmp}/wolfproof-policy.json"
            ARGS+=("--policy=${RUNNER_TEMP:-/tmp}/wolfproof-policy.json")
          fi
        elif [ -n "$FACTORY_BASE$FACTORY_ALLOWLIST$FACTORY_POLICY" ]; then
          # Refused, not ignored: a workflow that sets an allowlist and forgets factory: true believes
          # it is in a mode it is not in.
          echo "outcome=incomplete" >> "$GITHUB_OUTPUT"
          echo "::error title=wolfproof: usage error::base, allowlist and policy are factory-mode inputs; set factory: true or remove them. This is not a verdict on the project."
          exit 1
        fi
        # Reviewed findings, in either mode, outside the workspace for the allowlist's reason.
        if [ -n "$REVIEWED" ]; then
          printf '%s\n' "$REVIEWED" > "${RUNNER_TEMP:-/tmp}/wolfproof-reviewed.json"
          ARGS+=("--reviewed=${RUNNER_TEMP:-/tmp}/wolfproof-reviewed.json")
        fi
        # The image scan, with the trivy the step above installed and verified, and no other.
        if [ -n "$SCAN_IMAGE" ]; then
          export WOLFPROOF_TRIVY="${RUNNER_TEMP}/wolfproof-trivy/trivy"
          ARGS+=("--trivy-image=$SCAN_IMAGE" "--trivy-severity=${SCAN_SEVERITY:-HIGH}")
        fi
        # The source scan, with the bundle the step above installed and verified, and no other. A value
        # other than true or false is refused: a workflow that wrote `codeql: yes` believes it ran.
        case "$SCAN_CODEQL" in
          true)
            export WOLFPROOF_CODEQL="${RUNNER_TEMP}/wolfproof-codeql/codeql/codeql"
            ARGS+=("--codeql") ;;
          false|"") ;;
          *)
            echo "outcome=incomplete" >> "$GITHUB_OUTPUT"
            echo "::error title=wolfproof: usage error::codeql is \"true\" or \"false\", not \"$SCAN_CODEQL\". This is not a verdict on the project."
            exit 1 ;;
        esac

        # Once, not twice. terraform plan and checkov dominate the runtime here, and running the
        # gate a second time to get human output would double them on every CI job. The log view is
        # rendered from the same JSON that carries the verdict.
        node "${GITHUB_ACTION_PATH}/bin/validate.mjs" "${ARGS[@]}" --json > "$RESULT"
        CODE=$?

        node -e '
          const r = require(process.argv[1]);
          // A usage error or a gate that fell over writes a document with only the reason in it.
          // Rendering it as a result would print nothing useful before failing on r.controls.
          if (r.error) {
            console.log(`wolfproof did not produce a verdict: ${r.error}`);
            process.exit(0);
          }
          if (r.baseline) console.log(`baseline : set by the workflow (${r.baseline})`);
          // The same two lines the CLI prints. A baseline is set in a workflow, so this log is
          // where its author reads whether each sentence of it switched a check on.
          const req = r.requirementsRead || {};
          if (req.task) console.log(`task sentences: ${req.task.sentences}, ${req.task.read} read by a check, ${(req.task.covered || []).length ? `${req.task.covered.length} covered by an always-on check, ` : ""}${req.task.unread.length} by none`);
          if (req.baseline && req.baseline.unread.length) {
            console.log(`BASELINE NOT READ: ${req.baseline.unread.length} sentence(s) no check read — the project is not held to these:`);
            for (const s of req.baseline.unread) console.log(`  - line ${s.line}: ${s.text}${s.notCoveredBecause ? ` (${s.notCoveredBecause})` : ""}`);
          }
          for (const s of (req.baseline && req.baseline.covered) || []) console.log(`baseline covered: line ${s.line}: ${s.text} — ${s.coveredBy}`);
          for (const c of r.controls) console.log(`control  : ${c.name.padEnd(16)} ${c.status.padEnd(14)} ${(c.version ? `v${c.version}` : c.status === "ran" ? "v?" : "").padEnd(8)} ${c.resolvedFrom || c.error}`);
          console.log(`validators: ${r.validatorsRun.join(", ")}`);
          // Printed BEFORE the verdict, and printed at all. The result document carried these
          // three all along and this renderer showed none of them, so in CI -- the place the gate
          // is actually read -- a check that could not run, a tool with nothing in scope, and a
          // directory the project exempted were indistinguishable from silence. That is the
          // failure this control set exists to remove, in its own output.
          for (const c of r.couldNotRun || []) console.log(`COULD NOT RUN : ${c}`);
          if (r.coverage) console.log(`NOT READ      : ${r.coverage}`);
          for (const i of r.notApplicable || []) console.log(`not applicable: ${i.tool} — ${i.why}`);
          for (const e of r.exempt || []) console.log(`exempt        : ${e.path} — ${e.reason} (${e.marker})`);
          // The same line the CLI prints (lib/reviewed.mjs reviewedLine): a reviewed finding is out of
          // the verdict, never out of sight.
          for (const v of r.reviewed || []) console.log(`reviewed      : ${v.id} — ${v.where} — ${v.reason}${v.reviewer ? `, ${v.reviewer}` : ""}${v.expires ? `, until ${v.expires}` : ""} (${v.source})`);
          // The same factory lines the CLI prints, so the two renderers agree about what factory
          // mode compared with and decided. The decisions are in the findings and could-not-run lines.
          if (r.factory) {
            const f = r.factory;
            const n = (s) => f.grants.filter((g) => g.status === s).length;
            console.log(`factory       : base ${f.base.ref}${f.base.sha ? ` (${f.base.sha.slice(0, 12)})` : " — NOT RESOLVED"}; allowlist ${f.allowlist ? "set" : "none"}; policy ${f.policy ? "set" : "none, the defaults"}`);
            if (f.grants.length) console.log(`factory grants: ${n("pre-existing")} predate the change, ${n("allowlisted")} allowlisted, ${n("added")} added by it`);
            for (const note of f.notes || []) console.log(`factory note  : ${note}`);
            for (const i of (f.allowlist && f.allowlist.ignored) || []) console.log(`factory note  : allowlist entry ignored — it ${i.why}: ${JSON.stringify(i.entry)}`);
            console.log(`factory advisories: ${f.advisories.blocked} blocked, ${f.advisories.incomplete} made the run incomplete, ${f.advisories.dropped} counted and not blocking`);
          }
          console.log(`\nBLOCKING : ${r.blocking}${r.incomplete ? " FROM THE CHECKS THAT RAN" : ""}\n`);
          for (const f of r.findings) console.log(`  - ${f.message}\n`);
          // The same line the CLI prints (lib/reviewed.mjs reviewableLine): the report has no IDs, so it
          // says where to get them. The project path comes through the environment, never the script.
          const rv = { n: r.blocking ? (r.reviewable || []).length : 0, project: process.env.REVIEW_PROJECT || ".", codeql: (r.reviewable || []).some((id) => id.startsWith("codeql:")) };
          if (rv.n) console.log(`reviewable    : ${rv.n} ${rv.codeql ? "injection, authentication or CodeQL" : "injection or authentication"} finding${rv.n === 1 ? "" : "s"} above can be marked reviewed once read — wolfproof review ${rv.project}${rv.codeql ? " --codeql" : ""} lists ${rv.n === 1 ? "its ID" : "their IDs"}\n`);
          for (const a of r.advisories) console.log(`  . ${a.message}\n`);
        ' "$RESULT" || echo "(could not render the result; the JSON is at $RESULT)"

        echo "result=$RESULT" >> "$GITHUB_OUTPUT"
        BLOCKING=$(node -e "process.stdout.write(String(require(process.argv[1]).blocking ?? \"?\"))" "$RESULT" 2>/dev/null || echo "?")
        echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
        REASON=$(node -e "process.stdout.write(String(require(process.argv[1]).error || \"\"))" "$RESULT" 2>/dev/null || true)

        # Exit 3 is a DISTINCT outcome from exit 1 and must stay that way. Both fail the build; what
        # must never happen is reporting them identically. "Could not run" is not "found nothing",
        # and a consumer who cannot tell them apart has bought the silent pass this whole control
        # set exists to remove.
        case "$CODE" in
          0)
            echo "outcome=clean" >> "$GITHUB_OUTPUT"
            echo "::notice title=wolfproof::No blocking findings."
            exit 0
            ;;
          1)
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
            echo "::error title=wolfproof: blocked::$BLOCKING blocking finding(s). The gate ran in full; these are real."
            exit 1
            ;;
          3)
            echo "outcome=incomplete" >> "$GITHUB_OUTPUT"
            if [ -n "$REASON" ]; then
              echo "::error title=wolfproof: INCOMPLETE::The gate could not run: $REASON. This is not a verdict on the project."
            else
              echo "::error title=wolfproof: INCOMPLETE::Part of the gate could not run. This is not a pass and not a clean failure — the project was not fully checked. See the control list in the log."
            fi
            exit 1
            ;;
          2)
            echo "outcome=incomplete" >> "$GITHUB_OUTPUT"
            echo "::error title=wolfproof: usage error::The gate refused its inputs${REASON:+: $REASON}. Check the project and task-file inputs. This is not a verdict on the project."
            exit 1
            ;;
          *)
            echo "outcome=incomplete" >> "$GITHUB_OUTPUT"
            echo "::error title=wolfproof::Unexpected exit $CODE — treating as incomplete rather than as a pass."
            exit 1
            ;;
        esac

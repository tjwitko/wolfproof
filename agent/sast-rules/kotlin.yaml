# Injection rules for Kotlin (Spring, Ktor, servlets), written for wolfproof. See python.yaml for the
# split between blocking taint rules (ERROR) and advisory pattern rules (WARNING).
#
# Measured against Semgrep's Kotlin matching before being written: an annotated handler parameter
# matches as a source with or without a declared return type, taint follows a value into a string
# template ("ping $host", "${h}"), and Ktor's call.parameters[...] matches as written.
rules:
  - id: kotlin-command-injection
    mode: taint
    languages: [kotlin]
    severity: ERROR
    message: request data reaches a shell command
    metadata: { category: command injection }
    pattern-sources:
      # Spring MVC and JAX-RS: a handler's annotated parameters are request data, with or without a
      # declared return type.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|QueryParam|PathParam|HeaderParam|FormParam|CookieParam)$
          - pattern: $P
      # Ktor.
      - pattern-either:
          - pattern: call.parameters[...]
          - pattern: call.parameters.get(...)
          - pattern: call.parameters.getOrFail(...)
          - pattern: call.request.queryParameters[...]
          - pattern: call.request.queryParameters.get(...)
          - pattern: call.request.headers[...]
          - pattern: call.request.cookies[...]
          - pattern: call.receiveText()
          - pattern: call.receiveParameters()
          - pattern: call.receive<$T>()
      # Servlet API, as Kotlin calls it.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.queryString
    pattern-sinks:
      # exec(String) splits the string itself, so whatever builds it chooses the program and its
      # arguments. An array or list of fixed words with request data as one element starts no shell.
      - patterns:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern-not: Runtime.getRuntime().exec(arrayOf(...), ...)
          - pattern-not: Runtime.getRuntime().exec(listOf(...).toTypedArray(), ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec(arrayOf($SH, $FLAG, $CMD, ...), ...)
              - pattern: ProcessBuilder($SH, $FLAG, $CMD, ...)
              - pattern: ProcessBuilder(listOf($SH, $FLAG, $CMD, ...))
          - metavariable-regex:
              metavariable: $SH
              regex: ^"(sh|bash|/bin/sh|/bin/bash|cmd|cmd\.exe)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-c|/c)"$
          - focus-metavariable: $CMD
    pattern-sanitizers:
      - pattern: $X.toInt()
      - pattern: $X.toLong()

  - id: kotlin-sql-injection
    mode: taint
    languages: [kotlin]
    severity: ERROR
    message: request data is built into a SQL statement
    metadata: { category: SQL injection }
    pattern-sources:
      # Spring MVC and JAX-RS: a handler's annotated parameters are request data, with or without a
      # declared return type.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|QueryParam|PathParam|HeaderParam|FormParam|CookieParam)$
          - pattern: $P
      # Ktor.
      - pattern-either:
          - pattern: call.parameters[...]
          - pattern: call.parameters.get(...)
          - pattern: call.parameters.getOrFail(...)
          - pattern: call.request.queryParameters[...]
          - pattern: call.request.queryParameters.get(...)
          - pattern: call.request.headers[...]
          - pattern: call.request.cookies[...]
          - pattern: call.receiveText()
          - pattern: call.receiveParameters()
          - pattern: call.receive<$T>()
      # Servlet API, as Kotlin calls it.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.queryString
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $S.executeQuery($Q)
              - pattern: $S.executeUpdate($Q, ...)
              - pattern: $S.addBatch($Q)
              - pattern: $C.prepareStatement($Q, ...)
              - pattern: $C.prepareCall($Q, ...)
              - pattern: $J.queryForObject($Q, ...)
              - pattern: $J.queryForList($Q, ...)
              - pattern: $J.queryForMap($Q, ...)
              - pattern: $J.batchUpdate($Q, ...)
              - pattern: $E.createQuery($Q, ...)
              - pattern: $E.createNativeQuery($Q, ...)
              # Names other libraries use too, so only on a receiver that names a database.
              - patterns:
                  - pattern-either:
                      - pattern: $DB.query($Q, ...)
                      - pattern: $DB.update($Q, ...)
                      - pattern: $DB.execute($Q, ...)
                      - pattern: $DB.exec($Q, ...)
                  - metavariable-regex:
                      metavariable: $DB
                      regex: (?i)(jdbc|template|statement|stmt|conn|connection|db|database|datasource)$
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: $X.toInt()
      - pattern: $X.toLong()
      - pattern: $X.toIntOrNull()
      - pattern: $X.toLongOrNull()
      - pattern: Integer.parseInt(...)
      - pattern: UUID.fromString(...)

  - id: kotlin-code-injection
    mode: taint
    languages: [kotlin]
    severity: ERROR
    message: request data is evaluated as code
    metadata: { category: code injection }
    pattern-sources:
      # Spring MVC and JAX-RS: a handler's annotated parameters are request data, with or without a
      # declared return type.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|QueryParam|PathParam|HeaderParam|FormParam|CookieParam)$
          - pattern: $P
      # Ktor.
      - pattern-either:
          - pattern: call.parameters[...]
          - pattern: call.parameters.get(...)
          - pattern: call.parameters.getOrFail(...)
          - pattern: call.request.queryParameters[...]
          - pattern: call.request.queryParameters.get(...)
          - pattern: call.request.headers[...]
          - pattern: call.request.cookies[...]
          - pattern: call.receiveText()
          - pattern: call.receiveParameters()
          - pattern: call.receive<$T>()
      # Servlet API, as Kotlin calls it.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.queryString
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $ENGINE.eval($X, ...)
              - pattern: $P.parseExpression($X, ...)
              - pattern: SpelExpressionParser().parseExpression($X, ...)
              - pattern: ObjectInputStream($X)
          - focus-metavariable: $X

  - id: kotlin-sql-string-built
    languages: [kotlin]
    severity: WARNING
    message: a SQL statement is built by concatenation or a string template rather than passed parameters
    metadata: { category: SQL injection }
    patterns:
      - pattern-either:
          - pattern: $S.$M("..." + $X, ...)
          - pattern: $S.$M($X + "...", ...)
          - pattern: $S.$M(String.format(...), ...)
          - pattern: $S.$M("...".format(...), ...)
          - patterns:
              - pattern: $S.$M($STR, ...)
              - metavariable-pattern:
                  metavariable: $STR
                  patterns:
                    - pattern-regex: ^"[^"]*\$\{?\w
      - metavariable-regex:
          metavariable: $M
          regex: ^(executeQuery|executeUpdate|addBatch|prepareStatement|prepareCall|queryForObject|queryForList|queryForMap|batchUpdate|createQuery|createNativeQuery)$

  - id: kotlin-shell-nonliteral
    languages: [kotlin]
    severity: WARNING
    message: a shell command is built from a value that is not a literal
    metadata: { category: command injection }
    patterns:
      - pattern-either:
          - patterns:
              - pattern: Runtime.getRuntime().exec($CMD, ...)
              - pattern-not: Runtime.getRuntime().exec(arrayOf(...), ...)
              - pattern-not: Runtime.getRuntime().exec(listOf(...).toTypedArray(), ...)
          - patterns:
              - pattern-either:
                  - pattern: Runtime.getRuntime().exec(arrayOf($SH, $FLAG, $CMD, ...), ...)
                  - pattern: ProcessBuilder($SH, $FLAG, $CMD, ...)
                  - pattern: ProcessBuilder(listOf($SH, $FLAG, $CMD, ...))
              - metavariable-regex:
                  metavariable: $SH
                  regex: ^"(sh|bash|/bin/sh|/bin/bash|cmd|cmd\.exe)"$
              - metavariable-regex:
                  metavariable: $FLAG
                  regex: ^"(-c|/c)"$
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern: $X
            # A literal, unless it is a template with a value in it.
            - pattern-not-regex: ^"[^"$]*"$
      - focus-metavariable: $CMD

  # See java.yaml's java-sql-text-built: a query built into a variable in one function and executed in
  # another is not followed by taint, so SQL text with a template value or a concatenated value is
  # reported where it is built.
  - id: kotlin-sql-text-built
    languages: [kotlin]
    severity: WARNING
    message: SQL text is built by a string template or concatenation, wherever it is later executed
    metadata: { category: SQL injection }
    patterns:
      - pattern-regex: (?is)"\s*(select\s[^"]*\sfrom|insert\s+into|update\s+\S+\s+set|delete\s+from)\b[^"]*(\$\{?\w|"\s*\+\s*[\w(])
      - pattern-not-regex: (?m)^[ \t]*(//|\*).*$

  # A credential assembled from literals is still in the source, just not as one string, so
  # gitleaks -- which reads literals -- does not see it. See java.yaml for why the name has to END like
  # a credential and why prose is excluded.
  - id: kotlin-assembled-credential
    languages: [kotlin]
    severity: ERROR
    message: a credential is assembled from literals in the source
    metadata: { category: hardcoded credential }
    options:
      constant_propagation: false
    patterns:
      - pattern-either:
          - pattern: 'val $V = "$A" + "$B"'
          - pattern: 'val $V = "$A" + "$B" + "$C"'
          - pattern: 'val $V = "$A" + "$B" + "$C" + "$D"'
          - pattern: 'var $V = "$A" + "$B"'
          - pattern: 'var $V = "$A" + "$B" + "$C"'
          - pattern: 'val $V = listOf("$A", ...).joinToString(...)'
          - pattern: 'val $V = <... Base64.getDecoder().decode("$A") ...>'
          - pattern: 'val $V = "$A".reversed()'
          - pattern: '$V = "$A" + "$B"'
          - pattern: '$V = "$A" + "$B" + "$C"'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^.*?(api_?key|access_?key|secret(_?key)?|signing_?key|private_?key|token|passw(or)?d|pwd|passphrase|credentials?)$
      - metavariable-regex:
          metavariable: $V
          regex: ^\S+$
      - pattern-not-regex: (["'])[^"'\n]*\s[^"'\n]*\1\s*\+|\+\s*(["'])[^"'\n]*\s[^"'\n]*\2
      - focus-metavariable: $V

  # SSRF: request data choosing where the server connects. A fixed scheme and host with request data
  # only after the first path slash cannot be redirected, so that construction is a sanitizer.
  - id: kotlin-ssrf
    mode: taint
    languages: [kotlin]
    severity: ERROR
    message: request data chooses where the server sends a request
    metadata: { category: SSRF }
    pattern-sources:
      # Spring MVC and JAX-RS: a handler's annotated parameters are request data, with or without a
      # declared return type.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|QueryParam|PathParam|HeaderParam|FormParam|CookieParam)$
          - pattern: $P
      # Ktor.
      - pattern-either:
          - pattern: call.parameters[...]
          - pattern: call.parameters.get(...)
          - pattern: call.parameters.getOrFail(...)
          - pattern: call.request.queryParameters[...]
          - pattern: call.request.queryParameters.get(...)
          - pattern: call.request.headers[...]
          - pattern: call.request.cookies[...]
          - pattern: call.receiveText()
          - pattern: call.receiveParameters()
          - pattern: call.receive<$T>()
      # Servlet API, as Kotlin calls it.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.queryString
    pattern-sinks:
      # The request, not the URL: building one connects to nothing.
      - patterns:
          - pattern-either:
              - pattern: URL($U).openConnection(...)
              - pattern: URL($U).openStream()
              - pattern: URL($U).readText(...)
              - pattern: URL($U).readBytes()
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: $U.openConnection(...)
              - pattern: $U.openStream()
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: WebClient.create($URL)
              - pattern: $R.getForObject($URL, ...)
              - pattern: $R.getForEntity($URL, ...)
              - pattern: $R.postForObject($URL, ...)
              - pattern: $R.postForEntity($URL, ...)
              - pattern: $R.exchange($URL, ...)
              - pattern: HttpRequest.newBuilder(URI.create($URL))
              - pattern: $B.uri(URI.create($URL))
              - pattern: Jsoup.connect($URL)
          - focus-metavariable: $URL
      # Ktor's client: get/post are names other libraries use too, so only on a receiver called a client.
      - patterns:
          - pattern-either:
              - pattern: $CLIENT.get($URL, ...)
              - pattern: $CLIENT.post($URL, ...)
              - pattern: $CLIENT.request($URL, ...)
          - metavariable-regex:
              metavariable: $CLIENT
              regex: (?i)client$
          - focus-metavariable: $URL
    pattern-sanitizers:
      - patterns:
          - pattern: '"$P" + $X'
          - metavariable-regex:
              metavariable: $P
              regex: ^https?://[^/]+/
      - pattern-regex: '"https?://[^/#"$]+/[^"]*"'

  # Path traversal: request data naming a file the server opens, writes or deletes. File(dir, name) and
  # Path.resolve do not stop "../"; taking only the file name does.
  - id: kotlin-path-traversal
    mode: taint
    languages: [kotlin]
    severity: ERROR
    message: request data names a file the server reads, writes or deletes
    metadata: { category: path traversal }
    pattern-sources:
      # Spring MVC and JAX-RS: a handler's annotated parameters are request data, with or without a
      # declared return type.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...): $R { ... }
              - pattern-inside: |
                  fun $M(..., @$ANN(...) $P: $T, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|QueryParam|PathParam|HeaderParam|FormParam|CookieParam)$
          - pattern: $P
      # Ktor.
      - pattern-either:
          - pattern: call.parameters[...]
          - pattern: call.parameters.get(...)
          - pattern: call.parameters.getOrFail(...)
          - pattern: call.request.queryParameters[...]
          - pattern: call.request.queryParameters.get(...)
          - pattern: call.request.headers[...]
          - pattern: call.request.cookies[...]
          - pattern: call.receiveText()
          - pattern: call.receiveParameters()
          - pattern: call.receive<$T>()
      # Servlet API, as Kotlin calls it.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.queryString
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: File($P)
              - pattern: File($D, $P)
              - pattern: java.io.File($P)
              - pattern: Paths.get($P, ...)
              - pattern: Paths.get($D, $P, ...)
              - pattern: Path.of($P, ...)
              - pattern: Path.of($D, $P, ...)
              - pattern: FileInputStream($P)
              - pattern: FileOutputStream($P, ...)
              - pattern: FileReader($P, ...)
              - pattern: FileWriter($P, ...)
              - pattern: $DIR.resolve($P)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: File(...).name
      - pattern: $X.fileName
      - pattern: FilenameUtils.getName(...)
      - pattern: $X.toInt()
      - pattern: $X.toLong()
      - pattern: UUID.fromString(...)

  # XXE: the JVM's XML factories resolve external entities unless told not to, so the advisory is a
  # factory created without being hardened in the same function.
  - id: kotlin-xxe
    languages: [kotlin]
    severity: WARNING
    message: an XML parser factory is created without disabling external entities
    metadata: { category: XXE }
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: val $F = DocumentBuilderFactory.newInstance()
              - pattern: val $F = SAXParserFactory.newInstance()
          - pattern-not-inside: |
              val $F = $FACTORY.newInstance()
              ...
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
          - pattern-not-inside: |
              val $F = $FACTORY.newInstance()
              ...
              $F.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true)
      - patterns:
          - pattern: val $F = XMLInputFactory.newInstance()
          - pattern-not-inside: |
              val $F = XMLInputFactory.newInstance()
              ...
              $F.setProperty(XMLInputFactory.SUPPORT_DTD, false)
          - pattern-not-inside: |
              val $F = XMLInputFactory.newInstance()
              ...
              $F.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false)
